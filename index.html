<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Visas</title>
<meta name="description" content="Pässe, ETAs und Visa im Blick – mit Weltkarte und Ablauf-Erinnerungen.">
<meta name="theme-color" content="#f2f2f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Visas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/logo.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main id="app">
  <section class="view" id="view-map">
    <header class="nav">
      <div class="nav-top"><img class="logo" src="icons/logo.svg" alt=""><h1>Karte</h1></div>
      <div class="seg" id="modeSeg" role="tablist">
        <button data-mode="free">Reisefreiheit</button>
        <button data-mode="docs">Mit Dok.</button>
        <button data-mode="only">Nur Dok.</button>
        <button data-mode="cmp">Vergleich</button>
        <button data-mode="trips">Bereist</button>
      </div>
      <div class="seg" id="tripSeg" hidden style="margin-top:8px"><button data-v="m">Marius</button><button data-v="a">Agnessa</button><button data-v="both">Beide</button><button data-v="tog">Gemeinsam</button></div>
      <div class="search"><input id="mapSearch" type="search" placeholder="Land suchen" autocomplete="off"><div id="mapSuggest" class="suggest" hidden></div></div>
    </header>
    <div class="mapwrap" id="mapWrap">
      <div id="mapHint" class="hint" hidden></div>
      <div id="cityTip" class="tip" hidden></div>
      <div class="zoom"><button id="zIn" aria-label="Vergrößern">+</button><button id="zOut" aria-label="Verkleinern">−</button><button id="zReset" aria-label="Zurücksetzen">⤢</button><button id="zCity" aria-label="Städte-Punkte">✦</button></div>
      <div class="legend" id="legend"></div>
    </div>
  </section>

  <section class="view" id="view-list" hidden>
    <header class="nav">
      <div class="nav-top"><img class="logo" src="icons/logo.svg" alt=""><h1>Dokumente</h1><button class="plus" id="addBtn" aria-label="Neuer Eintrag">+</button></div>
      <div class="seg" id="filterSeg">
        <button data-f="all">Alle</button><button data-f="passport">Pässe</button><button data-f="eta">ETA/VoA</button><button data-f="evisa">e-Visum</button><button data-f="visa">Visum</button>
      </div>
    </header>
    <div class="scroll" id="listBody"></div>
  </section>

  <section class="view" id="view-trips" hidden>
    <header class="nav">
      <div class="nav-top"><img class="logo" src="icons/logo.svg" alt=""><h1>Reisen</h1></div>
      <div class="seg" id="personSeg"><button data-p="m">Marius</button><button data-p="a">Agnessa</button></div>
    </header>
    <div class="scroll" id="tripsBody"></div>
  </section>

  <section class="view" id="view-settings" hidden>
    <header class="nav"><div class="nav-top"><img class="logo" src="icons/logo.svg" alt=""><h1>Einstellungen</h1></div></header>
    <div class="scroll" id="settingsBody"></div>
  </section>
</main>

<nav class="tabbar" id="tabbar">
  <button data-tab="map" class="on"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg><span>Karte</span></button>
  <button data-tab="list"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h5"/></svg><span>Dokumente</span></button>
  <button data-tab="trips"><svg viewBox="0 0 24 24"><path d="M12 21s-6-5.6-6-10.5a6 6 0 0112 0C18 15.4 12 21 12 21z"/><circle cx="12" cy="10.5" r="2.2"/></svg><span>Reisen</span></button>
  <button data-tab="settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg><span>Einstellungen</span></button>
</nav>
<div id="sheetRoot"></div>
<script src="js/app.js" defer></script>
</body>
</html>
