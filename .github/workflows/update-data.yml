name: Reisedaten aktualisieren
on:
  schedule: [{ cron: '0 5 * * 1' }]   # montags
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Snapshot laden
        run: |
          curl -fsSL https://raw.githubusercontent.com/ilyankou/passport-index-dataset/master/passport-index-tidy-iso2.csv -o /tmp/new.csv
          head -1 /tmp/new.csv | grep -q '^Passport,Destination,Requirement' && [ "$(wc -l < /tmp/new.csv)" -gt 30000 ]
          cp /tmp/new.csv data/passport-index-tidy-iso2.csv
          echo "{\"snapshot\":\"$(date +%F)\"}" > data/meta.json
      - name: Commit
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add data && (git diff --cached --quiet || git commit -m "Reisedaten aktualisiert" && git push)
